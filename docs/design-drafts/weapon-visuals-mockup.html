<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무기 12종 비주얼 목업 v2 — 기존 캐릭터 + 신규 무기</title>
<style>
  :root {
    --bg: #0b0f0d;
    --amber: #ffd166;
    --text: #edf4ef;
    --dim: rgba(237, 244, 239, 0.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 80px;
    background:
      radial-gradient(circle at 30% 20%, rgba(60, 80, 60, 0.16), transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  h2 {
    margin: 44px 0 14px;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(237, 244, 239, 0.5);
    text-transform: uppercase;
  }
  .note { font-size: 12px; color: var(--dim); margin: 0 0 8px; line-height: 1.6; }

  .pose-toggle { display: flex; gap: 6px; margin: 0 0 14px; }
  .pose-toggle button {
    padding: 6px 14px;
    border: 1px solid rgba(255, 209, 102, 0.3);
    border-radius: 8px;
    background: rgba(237, 244, 239, 0.05);
    color: rgba(237, 244, 239, 0.7);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .pose-toggle button.active {
    background: rgba(255, 209, 102, 0.16);
    color: var(--amber);
    border-color: rgba(255, 209, 102, 0.6);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
    gap: 16px;
  }
  .card {
    border: 1px solid rgba(35, 43, 35, 0.9);
    border-radius: 12px;
    background: linear-gradient(160deg, #171d17, #101511);
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  .card .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px 6px;
  }
  .card .head b { font-size: 12px; color: rgba(237, 244, 239, 0.85); }
  .card .head span {
    font-size: 9.5px;
    color: rgba(237, 244, 239, 0.3);
    font-family: ui-monospace, Consolas, monospace;
  }
  .card canvas { display: block; width: 100%; height: auto; }

  .compare {
    display: grid;
    gap: 4px;
    padding: 18px;
    border: 1px solid rgba(35, 43, 35, 0.9);
    border-radius: 12px;
    background: #182417;
    max-width: 620px;
  }
  .compare .rowline {
    display: grid;
    grid-template-columns: 80px 1fr;
    align-items: center;
    gap: 10px;
  }
  .compare .rowline span {
    font-size: 11px;
    font-weight: 800;
    color: rgba(237, 244, 239, 0.6);
    text-align: right;
  }
  .compare canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>

<h1>무기 12종 비주얼 목업 v2</h1>
<p class="note">
  <b>캐릭터 = 게임 원본 그대로</b> (renderer.js drawStandingInfantryBody 좌표·색 이식, 청팀 기본 스킨) · <b>무기만 신규 디자인.</b><br>
  포즈 전환은 게임과 동일한 장착 규칙(이동: 몸 옆 -0.52rad / 조준: 전방 정렬)을 그대로 따릅니다.
</p>

<div class="pose-toggle">
  <button id="poseMove" onclick="setPose('stand-move')">이동 자세</button>
  <button id="poseFire" class="active" onclick="setPose('stand-fire')">조준 자세</button>
</div>

<h2>1 · 인게임 장면 (기존 캐릭터 + 신규 무기, ×8)</h2>
<div class="grid" id="cards"></div>

<h2>2 · 무기 단독 길이 비교 (같은 배율)</h2>
<p class="note">저격(24)·RPG(32)가 길고 권총(9)이 가장 짧아야 정상 — 실루엣 판독성 확인용.</p>
<div class="compare" id="compare"></div>

<script>
"use strict";

// ============================================================
// 공통
// ============================================================
const weapons = [
  { id: "rifle",           name: "소총",         L: 16, W: 5 },
  { id: "smg",             name: "기관단총",      L: 12, W: 6 },
  { id: "lmg",             name: "경기관총",      L: 20, W: 6 },
  { id: "machinegun",      name: "기관총",        L: 20, W: 6 },
  { id: "pistol",          name: "권총",          L: 9,  W: 4 },
  { id: "sniper",          name: "저격총",        L: 24, W: 4 },
  { id: "grenade",         name: "수류탄",        L: 10, W: 7 },
  { id: "grenadeLauncher", name: "유탄발사기",    L: 20, W: 6 },
  { id: "rpg",             name: "RPG",           L: 32, W: 9 },
  { id: "repairKit",       name: "의료/수리키트",  L: 12, W: 7 },
  { id: "reconDrone",      name: "정찰드론",      L: 14, W: 8 },
  { id: "kamikazeDrone",   name: "자폭드론",      L: 16, W: 9 }
];

function roundRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

// ============================================================
// 게임 원본 캐릭터 (renderer.js drawStandingInfantryBody 이식)
// 청팀 기본 스킨 · radius 10 · sway 0
// ============================================================
const style = {
  cloth: "#43533f",
  clothDark: "#2f3b30",
  vest: "#202920",
  gear: "#171d18",
  helmet: "#202a22",
  boot: "#111611",
  patch: "#89d27e",
  patchDim: "rgba(182, 220, 255, 0.62)"
};

function drawSoldier(ctx, pose) {
  const r = 10;
  const firing = pose === "stand-fire";

  // 그림자 (drawInfantry :1165)
  ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
  ctx.beginPath();
  ctx.ellipse(0, 5, 13, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // 배낭 (gear)
  ctx.fillStyle = style.gear;
  roundRect(ctx, -r * 1.16, -r * 0.46, r * 0.48, r * 0.92, 3.5);
  ctx.fill();
  ctx.strokeStyle = "rgba(5, 8, 6, 0.58)";
  ctx.lineWidth = 1.1;
  ctx.stroke();
  ctx.fillStyle = "rgba(237, 244, 239, 0.08)";
  roundRect(ctx, -r * 1.04, -r * 0.32, r * 0.12, r * 0.64, 2);
  ctx.fill();

  // 팔
  ctx.strokeStyle = style.clothDark;
  ctx.lineWidth = 3.1;
  ctx.beginPath();
  if (firing) {
    ctx.moveTo(-r * 0.02, -r * 0.5);
    ctx.lineTo(r * 0.42, -r * 0.24);
    ctx.moveTo(-r * 0.02, r * 0.5);
    ctx.lineTo(r * 0.42, r * 0.22);
  } else {
    ctx.moveTo(-r * 0.16, -r * 0.56);
    ctx.lineTo(r * 0.08, -r * 0.66);
    ctx.moveTo(-r * 0.16, r * 0.56);
    ctx.lineTo(r * 0.08, r * 0.66);
  }
  ctx.stroke();

  // 상의
  ctx.fillStyle = style.cloth;
  roundRect(ctx, -r * 0.7, -r * 0.58, r * 1.02, r * 1.16, 4.5);
  ctx.fill();
  ctx.strokeStyle = "rgba(5, 8, 6, 0.48)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // 방탄조끼
  ctx.fillStyle = style.vest;
  roundRect(ctx, -r * 0.5, -r * 0.48, r * 0.64, r * 0.96, 3.5);
  ctx.fill();
  ctx.strokeStyle = "rgba(5, 8, 6, 0.45)";
  ctx.lineWidth = 0.9;
  ctx.stroke();

  // 가슴 하이라이트
  ctx.fillStyle = "rgba(237, 244, 239, 0.1)";
  roundRect(ctx, -r * 0.24, -r * 0.38, r * 0.16, r * 0.76, 2);
  ctx.fill();

  // 어깨 패치
  ctx.fillStyle = style.patchDim;
  roundRect(ctx, -r * 0.04, -r * 0.62, r * 0.26, r * 0.11, 1.5);
  ctx.fill();
  ctx.fillStyle = style.patch;
  roundRect(ctx, r * 0.42, -r * 0.08, r * 0.14, r * 0.16, 1.2);
  ctx.fill();

  // 목 그림자
  ctx.fillStyle = "rgba(11, 15, 12, 0.38)";
  roundRect(ctx, r * 0.22, -r * 0.2, r * 0.18, r * 0.4, 2);
  ctx.fill();

  // 헬멧
  ctx.fillStyle = style.helmet;
  ctx.beginPath();
  ctx.ellipse(r * 0.66, 0, Math.max(4.2, r * 0.42), Math.max(4, r * 0.43), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(5, 8, 6, 0.62)";
  ctx.lineWidth = 1.1;
  ctx.stroke();

  ctx.fillStyle = "rgba(10, 14, 11, 0.34)";
  ctx.beginPath();
  ctx.ellipse(r * 0.78, 0, r * 0.2, r * 0.33, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(237, 244, 239, 0.08)";
  roundRect(ctx, r * 0.5, -r * 0.05, r * 0.28, r * 0.1, 1);
  ctx.fill();
  ctx.fillStyle = style.patch;
  roundRect(ctx, r * 0.58, -r * 0.24, r * 0.15, r * 0.08, 1);
  ctx.fill();
}

// ============================================================
// 신규 무기 (탑뷰) — 게임 px 단위, 총구 +x, 중심선 y=0
// 팔레트: 건메탈 #262c1f/#1a1f15 · 올리브 퍼니처 #3f4a33 · 목재 #5d4326
// ============================================================
const MET = "#262c1f";
const METD = "#1a1f15";
const FURN = "#3f4a33";
const WOOD = "#5d4326";
const EDGE = "rgba(6, 9, 5, 0.55)";
const HILT = "rgba(237, 244, 239, 0.13)";

function edge(ctx) {
  ctx.strokeStyle = EDGE;
  ctx.lineWidth = 0.45;
  ctx.stroke();
}

const drawWeapon = {
  rifle(ctx) {
    ctx.fillStyle = FURN;                       // 개머리판
    roundRect(ctx, -4.6, -1.7, 4.8, 3.4, 1); ctx.fill(); edge(ctx);
    ctx.fillStyle = MET;                        // 몸통
    roundRect(ctx, 0, -2.5, 8.5, 5, 1); ctx.fill(); edge(ctx);
    ctx.strokeStyle = HILT; ctx.lineWidth = 0.6; // 상부 레일
    ctx.beginPath(); ctx.moveTo(1, -1.7); ctx.lineTo(8, -1.7); ctx.stroke();
    ctx.fillStyle = METD;                       // 탄창 (오른쪽으로 삐져나옴)
    roundRect(ctx, 3.6, 2.2, 2.8, 3, 0.8); ctx.fill(); edge(ctx);
    ctx.fillStyle = METD;                       // 총열
    roundRect(ctx, 8.5, -1.15, 5.8, 2.3, 0.8); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#12160d";                  // 가늠쇠·소염기
    roundRect(ctx, 12.6, -1.9, 0.8, 1, 0.3); ctx.fill();
    roundRect(ctx, 14.3, -1.5, 1.7, 3, 0.6); ctx.fill(); edge(ctx);
  },

  smg(ctx) {
    ctx.strokeStyle = METD; ctx.lineWidth = 1;  // 와이어 개머리판
    ctx.beginPath();
    ctx.moveTo(-1, -1.3); ctx.lineTo(-3.4, -1.3);
    ctx.moveTo(-1, 1.3); ctx.lineTo(-3.4, 1.3);
    ctx.moveTo(-3.4, -1.3); ctx.arc(-3.4, 0, 1.3, -Math.PI / 2, Math.PI / 2, true);
    ctx.stroke();
    ctx.fillStyle = MET;                        // 몸통
    roundRect(ctx, -1, -2.6, 7, 5.2, 1.2); ctx.fill(); edge(ctx);
    ctx.fillStyle = METD;                       // 전방 탄창
    roundRect(ctx, 2.4, 2.4, 3, 3.4, 0.8); ctx.fill(); edge(ctx);
    ctx.fillStyle = METD;                       // 총열 + 소음기
    roundRect(ctx, 6, -1, 3.2, 2, 0.7); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#161b11";
    roundRect(ctx, 9.2, -1.35, 2.8, 2.7, 1); ctx.fill(); edge(ctx);
  },

  lmg(ctx) {
    ctx.fillStyle = FURN;
    roundRect(ctx, -4.6, -1.7, 4.8, 3.4, 1); ctx.fill(); edge(ctx);
    ctx.fillStyle = MET;
    roundRect(ctx, 0, -2.7, 9.5, 5.4, 1); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#141910";                  // 운반 손잡이
    roundRect(ctx, 4.6, -3.5, 3.2, 1, 0.4); ctx.fill();
    ctx.fillStyle = METD;                       // 드럼 탄창
    ctx.beginPath(); ctx.arc(4.6, 3.2, 2.5, 0, Math.PI * 2); ctx.fill(); edge(ctx);
    ctx.fillStyle = "rgba(237,244,239,0.07)";
    ctx.beginPath(); ctx.arc(4.6, 3.2, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = METD;                       // 총열
    roundRect(ctx, 9.5, -1.2, 8.2, 2.4, 0.8); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "#12160d"; ctx.lineWidth = 0.8; // 접힌 양각대
    ctx.beginPath();
    ctx.moveTo(10.5, -1.7); ctx.lineTo(15.5, -1.9);
    ctx.moveTo(10.5, 1.7); ctx.lineTo(15.5, 1.9);
    ctx.stroke();
    ctx.fillStyle = "#12160d";
    roundRect(ctx, 17.7, -1.55, 2.3, 3.1, 0.7); ctx.fill(); edge(ctx);
  },

  machinegun(ctx) {
    ctx.fillStyle = METD;                       // 스켈레톤 개머리판
    roundRect(ctx, -4.6, -1.6, 1.3, 3.2, 0.5); ctx.fill(); edge(ctx);
    roundRect(ctx, -3.3, -0.8, 3.3, 1.6, 0.5); ctx.fill(); edge(ctx);
    ctx.fillStyle = MET;                        // 몸통 (박스형)
    roundRect(ctx, 0, -2.9, 10, 5.8, 0.9); ctx.fill(); edge(ctx);
    ctx.fillStyle = METD;                       // 탄띠 급탄 박스 (왼쪽)
    roundRect(ctx, 2.6, -6.2, 5, 3.4, 0.7); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#c9a34e";                  // 탄띠
    ctx.beginPath(); ctx.arc(3.7, -4.5, 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5.1, -4.5, 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6.5, -4.5, 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = METD;                       // 굵은 총열
    roundRect(ctx, 10, -1.4, 7.2, 2.8, 0.9); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(11.5, -1.4); ctx.lineTo(11.5, 1.4);
    ctx.moveTo(13, -1.4); ctx.lineTo(13, 1.4);
    ctx.stroke();
    ctx.strokeStyle = "#12160d"; ctx.lineWidth = 1; // 펼친 양각대
    ctx.beginPath();
    ctx.moveTo(16.2, -1.2); ctx.lineTo(19.4, -4.4);
    ctx.moveTo(16.2, 1.2); ctx.lineTo(19.4, 4.4);
    ctx.stroke();
    ctx.fillStyle = "#12160d";
    roundRect(ctx, 17.2, -1.75, 2.6, 3.5, 0.8); ctx.fill(); edge(ctx);
  },

  pistol(ctx) {
    ctx.fillStyle = MET;                        // 슬라이드
    roundRect(ctx, 0, -1.5, 7, 3, 0.9); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 0.5; // 세레이션
    ctx.beginPath();
    ctx.moveTo(0.9, -1); ctx.lineTo(0.9, 1);
    ctx.moveTo(1.7, -1); ctx.lineTo(1.7, 1);
    ctx.moveTo(2.5, -1); ctx.lineTo(2.5, 1);
    ctx.stroke();
    ctx.fillStyle = "#12160d";                  // 해머·총구
    roundRect(ctx, -0.9, -0.8, 1, 1.6, 0.3); ctx.fill();
    roundRect(ctx, 7, -1, 1.3, 2, 0.4); ctx.fill(); edge(ctx);
    ctx.fillStyle = HILT;                       // 가늠자
    roundRect(ctx, 5.6, -0.4, 0.7, 0.8, 0.2); ctx.fill();
  },

  sniper(ctx) {
    ctx.fillStyle = FURN;                       // 개머리판 + 칙패드
    roundRect(ctx, -5, -1.6, 5.2, 3.2, 1); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#333d29";
    roundRect(ctx, -3.6, -2.3, 2.7, 1, 0.4); ctx.fill();
    ctx.fillStyle = MET;                        // 몸통
    roundRect(ctx, 0, -1.9, 7, 3.8, 0.9); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "#12160d"; ctx.lineWidth = 1.1; // 볼트 손잡이
    ctx.beginPath(); ctx.moveTo(5.4, 1.6); ctx.lineTo(6.8, 3.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(6.9, 3.2, 0.6, 0, Math.PI * 2);
    ctx.fillStyle = "#12160d"; ctx.fill();
    ctx.fillStyle = "#12170e";                  // 스코프
    ctx.beginPath(); ctx.arc(3.5, 0, 2.1, 0, Math.PI * 2); ctx.fill(); edge(ctx);
    ctx.fillStyle = "rgba(140, 220, 150, 0.5)";
    ctx.beginPath(); ctx.arc(3.5, 0, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = METD;                       // 긴 총열
    roundRect(ctx, 7, -0.95, 14.2, 1.9, 0.7); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#12160d";                  // 총구 제동기
    roundRect(ctx, 21.2, -1.3, 2.6, 2.6, 0.7); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(22, -1.3); ctx.lineTo(22, 1.3);
    ctx.moveTo(22.9, -1.3); ctx.lineTo(22.9, 1.3);
    ctx.stroke();
  },

  grenade(ctx) {
    ctx.translate(2.5, 0.5);
    ctx.fillStyle = "#29301f";                  // 몸통
    ctx.beginPath(); ctx.ellipse(2, 0, 3.2, 2.6, 0, 0, Math.PI * 2); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "rgba(0,0,0,0.42)"; ctx.lineWidth = 0.45; // 파편 격자
    ctx.beginPath();
    ctx.moveTo(0.2, -1.7); ctx.lineTo(0.2, 1.7);
    ctx.moveTo(2, -2.3); ctx.lineTo(2, 2.3);
    ctx.moveTo(3.8, -1.7); ctx.lineTo(3.8, 1.7);
    ctx.moveTo(-0.8, -0.8); ctx.lineTo(4.9, -0.8);
    ctx.moveTo(-1.1, 0.6); ctx.lineTo(5.1, 0.6);
    ctx.stroke();
    ctx.fillStyle = METD;                       // 신관 캡
    roundRect(ctx, 4.9, -1, 1.7, 2, 0.5); ctx.fill(); edge(ctx);
    ctx.strokeStyle = METD; ctx.lineWidth = 0.8; // 레버(스푼)
    ctx.beginPath(); ctx.moveTo(5.5, -0.9); ctx.quadraticCurveTo(4, -3.2, 1, -2.9); ctx.stroke();
    ctx.strokeStyle = "#b7975a"; ctx.lineWidth = 0.7; // 안전핀 링
    ctx.beginPath(); ctx.arc(5.6, -2.1, 0.9, 0, Math.PI * 2); ctx.stroke();
  },

  grenadeLauncher(ctx) {
    ctx.fillStyle = FURN;
    roundRect(ctx, -4.6, -1.7, 4.8, 3.4, 1); ctx.fill(); edge(ctx);
    ctx.fillStyle = MET;
    roundRect(ctx, 0, -2, 4.5, 4, 0.9); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#20261a";                  // 굵은 발사관
    roundRect(ctx, 4.5, -2.8, 12.5, 5.6, 2.6); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 0.6; // 중절 힌지
    ctx.beginPath(); ctx.moveTo(5.6, -2.4); ctx.lineTo(5.6, 2.4); ctx.stroke();
    ctx.fillStyle = "#0a0e07";                  // 개방 총구
    ctx.beginPath(); ctx.ellipse(17, 0, 0.9, 2.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#12160d";                  // 조준 사다리
    roundRect(ctx, 6.4, -3.8, 1, 1.3, 0.3); ctx.fill();
  },

  rpg(ctx) {
    ctx.fillStyle = METD;                       // 후방 배기 나팔
    ctx.beginPath();
    ctx.moveTo(-4, -2.2); ctx.lineTo(0, -1.4); ctx.lineTo(0, 1.4); ctx.lineTo(-4, 2.2);
    ctx.closePath(); ctx.fill(); edge(ctx);
    ctx.fillStyle = MET;                        // 발사관
    roundRect(ctx, 0, -1.4, 20, 2.8, 1); ctx.fill(); edge(ctx);
    ctx.fillStyle = WOOD;                       // 목재 열차단부
    roundRect(ctx, 7, -1.4, 6, 2.8, 0); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#141a10";                  // 그립 2개
    roundRect(ctx, 8.2, 1.6, 2, 2.8, 0.6); ctx.fill(); edge(ctx);
    roundRect(ctx, 12, 1.6, 2, 2.6, 0.6); ctx.fill(); edge(ctx);
    ctx.fillStyle = "#12160d";                  // 조준기
    roundRect(ctx, 4.5, -2.7, 1, 1.5, 0.3); ctx.fill();
    ctx.fillStyle = MET;                        // 탄두 (원뿔)
    ctx.beginPath();
    ctx.moveTo(20, -2.7);
    ctx.quadraticCurveTo(27, -2.4, 31, 0);
    ctx.quadraticCurveTo(27, 2.4, 20, 2.7);
    ctx.closePath(); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(21, -2.6); ctx.lineTo(21, 2.6); ctx.stroke();
    ctx.strokeStyle = "#12160d"; ctx.lineWidth = 1.1; // 신관 침
    ctx.beginPath(); ctx.moveTo(31, 0); ctx.lineTo(32.4, 0); ctx.stroke();
  },

  repairKit(ctx) {
    ctx.translate(1, 0.5);
    ctx.fillStyle = FURN;                       // 케이스
    roundRect(ctx, 0, -3.4, 10, 6.8, 1.2); ctx.fill(); edge(ctx);
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 0.55; // 뚜껑 라인
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = "#141a10";                  // 잠금 클립
    roundRect(ctx, 2, -0.7, 1.2, 1.4, 0.3); ctx.fill();
    roundRect(ctx, 6.8, -0.7, 1.2, 1.4, 0.3); ctx.fill();
    ctx.fillStyle = "rgba(237, 244, 239, 0.82)"; // 십자
    roundRect(ctx, 4.4, -2.6, 1.2, 2.1, 0.2); ctx.fill();
    roundRect(ctx, 3.4, -2.05, 3.2, 1, 0.2); ctx.fill();
  },

  reconDrone(ctx) {
    ctx.translate(2, 0);
    ctx.strokeStyle = "#141910"; ctx.lineWidth = 1; // 암 4개
    ctx.beginPath();
    ctx.moveTo(3, -1.6); ctx.lineTo(0.5, -3.6);
    ctx.moveTo(7, -1.6); ctx.lineTo(9.5, -3.6);
    ctx.moveTo(3, 1.6); ctx.lineTo(0.5, 3.6);
    ctx.moveTo(7, 1.6); ctx.lineTo(9.5, 3.6);
    ctx.stroke();
    ctx.fillStyle = "rgba(180, 194, 181, 0.2)"; // 로터 디스크
    ctx.beginPath(); ctx.ellipse(0.5, -3.6, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9.5, -3.6, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.5, 3.6, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9.5, 3.6, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = METD;                       // 모터 포드
    ctx.beginPath(); ctx.arc(0.5, -3.6, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9.5, -3.6, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.5, 3.6, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9.5, 3.6, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = MET;                        // 기체
    roundRect(ctx, 2, -2, 6, 4, 1.3); ctx.fill(); edge(ctx);
    ctx.fillStyle = "rgba(140, 216, 255, 0.85)"; // 카메라
    ctx.beginPath(); ctx.arc(5, 0, 0.95, 0, Math.PI * 2); ctx.fill();
  },

  kamikazeDrone(ctx) {
    ctx.translate(1.5, 0);
    ctx.strokeStyle = "#141910"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(3.5, -1.8); ctx.lineTo(1, -4);
    ctx.moveTo(8.5, -1.8); ctx.lineTo(11, -4);
    ctx.moveTo(3.5, 1.8); ctx.lineTo(1, 4);
    ctx.moveTo(8.5, 1.8); ctx.lineTo(11, 4);
    ctx.stroke();
    ctx.fillStyle = "rgba(203, 112, 62, 0.22)";
    ctx.beginPath(); ctx.ellipse(1, -4, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(11, -4, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(1, 4, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(11, 4, 2, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = METD;
    ctx.beginPath(); ctx.arc(1, -4, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -4, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(1, 4, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, 4, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = MET;                        // 기체
    roundRect(ctx, 2.5, -2.2, 7, 4.4, 1.3); ctx.fill(); edge(ctx);
    ctx.fillStyle = "rgba(255, 107, 94, 0.85)"; // 경고띠 2줄
    ctx.fillRect(4, -2.2, 1, 4.4);
    ctx.fillRect(6.5, -2.2, 1, 4.4);
    ctx.fillStyle = METD;                       // 탄두 노즈
    ctx.beginPath();
    ctx.moveTo(9.5, -1.1); ctx.lineTo(13, 0); ctx.lineTo(9.5, 1.1);
    ctx.closePath(); ctx.fill(); edge(ctx);
    ctx.fillStyle = "rgba(255, 107, 94, 0.95)"; // 신관 팁
    ctx.beginPath(); ctx.arc(13.3, 0, 0.6, 0, Math.PI * 2); ctx.fill();
  }
};

// ============================================================
// 장착 규칙 (renderer.js drawInfantryWeapon 이식)
// ============================================================
function weaponMount(id, pose) {
  const rpg = id === "rpg";
  if (pose === "stand-fire") {
    return { sideOffset: rpg ? 3.8 : 3.1, forwardOffset: 2.3, weaponAngle: -0.04 };
  }
  return { sideOffset: rpg ? 7 : 8.4, forwardOffset: -5.3, weaponAngle: -0.52 };
}

// ============================================================
// 렌더
// ============================================================
let pose = "stand-fire";

function renderScene(canvas, weapon) {
  const ctx = canvas.getContext("2d");
  const zoom = 8;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 지형 배경 (그리드 없음 — 새 디자인 언어)
  const terrain = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  terrain.addColorStop(0, "#27402a");
  terrain.addColorStop(1, "#1e3322");
  ctx.fillStyle = terrain;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(24, 42, 26, 0.5)";
  ctx.beginPath(); ctx.ellipse(canvas.width * 0.75, 30, 120, 44, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(58, 52, 40, 0.22)";
  ctx.beginPath(); ctx.ellipse(canvas.width * 0.18, canvas.height - 28, 90, 30, 0, 0, Math.PI * 2); ctx.fill();

  // 병사 + 무기 (게임과 동일한 변환 순서)
  ctx.translate(110, canvas.height / 2);
  ctx.scale(zoom, zoom);

  drawSoldier(ctx, pose);

  const mount = weaponMount(weapon.id, pose);
  ctx.save();
  ctx.translate(0, mount.sideOffset);
  ctx.rotate(mount.weaponAngle);
  ctx.translate(mount.forwardOffset, 0);
  drawWeapon[weapon.id](ctx);
  ctx.restore();
}

function renderCompare(canvas, weapon) {
  const ctx = canvas.getContext("2d");
  const zoom = 6;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(237, 244, 239, 0.14)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(1, canvas.height); ctx.stroke();
  ctx.translate(36, canvas.height / 2);
  ctx.scale(zoom, zoom);
  ctx.save();
  drawWeapon[weapon.id](ctx);
  ctx.restore();
}

// 카드 생성
const cardsRoot = document.getElementById("cards");
const sceneCanvases = [];
for (const weapon of weapons) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="head"><b>${weapon.name}</b><span>${weapon.L}×${weapon.W}px · ×8</span></div>`;
  const canvas = document.createElement("canvas");
  canvas.width = 456;
  canvas.height = 232;
  card.append(canvas);
  cardsRoot.append(card);
  sceneCanvases.push([canvas, weapon]);
  renderScene(canvas, weapon);
}

// 길이 비교
const compareRoot = document.getElementById("compare");
for (const weapon of weapons) {
  const line = document.createElement("div");
  line.className = "rowline";
  const label = document.createElement("span");
  label.textContent = weapon.name;
  const canvas = document.createElement("canvas");
  canvas.width = 480;
  canvas.height = 76;
  line.append(label, canvas);
  compareRoot.append(line);
  renderCompare(canvas, weapon);
}

// 포즈 전환
function setPose(next) {
  pose = next;
  document.getElementById("poseMove").classList.toggle("active", next === "stand-move");
  document.getElementById("poseFire").classList.toggle("active", next === "stand-fire");
  for (const [canvas, weapon] of sceneCanvases) renderScene(canvas, weapon);
}
