<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Iron Line - 관리자 관전센터</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="build-info.css">
    <link rel="stylesheet" href="performance-monitor.css">
    <link rel="stylesheet" href="admin-observer.css">
  </head>
  <body class="admin-standalone-page admin-ops-expanded">
    <canvas id="game" tabindex="0" aria-label="Iron Line 관리자 전장 관전 화면"></canvas>

    <section class="admin-panel hidden" id="adminPanel" aria-label="관리자 관전 패널">
      <div class="admin-head">
        <div>
          <strong>Iron Line 운영센터</strong>
          <span id="adminStatus">관전 준비</span>
        </div>
        <div class="admin-head-actions" aria-label="운영센터 보기 전환">
          <button type="button" class="active" data-admin-layout="ops" aria-pressed="true">운영 전체</button>
          <button type="button" data-admin-layout="observer" aria-pressed="false">전장 보기</button>
        </div>
        <button type="button" id="adminClose" aria-label="관리자 패널 닫기">&times;</button>
      </div>

      <div class="admin-tabs" role="tablist" aria-label="관리자 탭">
        <button type="button" class="active" data-admin-tab="player">접속자</button>
        <button type="button" data-admin-tab="spawn">스폰</button>
        <button type="button" data-admin-tab="ai">AI 연구실</button>
      </div>

      <div class="admin-page active" data-admin-page="player">
        <p class="admin-hint">관리자는 플레이어로 접속하지 않고 전장 상태와 방 상태만 관전합니다.</p>
      </div>

      <div class="admin-page" data-admin-page="spawn">
        <p class="admin-hint">운영 테스트용 스폰 제어입니다. 관전/실험 중에만 사용합니다.</p>
      </div>

      <div class="admin-page" data-admin-page="ai">
        <div class="admin-grid-actions">
          <button type="button" data-admin-action="toggle-ai">AI 정지/재개</button>
          <button type="button" data-admin-action="clear-effects">이펙트 제거</button>
          <button type="button" data-admin-action="debug-ai">AI 생각 표시</button>
          <button type="button" data-admin-action="debug-nav">경로 그래프 표시</button>
        </div>
      </div>
    </section>
